<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — GAMORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <span class="logo-mark">▣</span>
        <span class="logo-text">GAMORA</span>
      </a>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to sync your favorites and scores.</p>

      <p class="auth-message hidden" id="authMessage"></p>

      <form id="loginForm">
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>

        <div class="auth-forgot">
          <button type="button" id="forgotBtn">Forgot password?</button>
        </div>

        <button type="submit" class="auth-submit" id="submitBtn">LOGIN</button>
      </form>

      <p class="auth-footer-links">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
  const messageEl = document.getElementById("authMessage");
  const submitBtn = document.getElementById("submitBtn");

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = `auth-message ${type}`;
  }

  // Already logged in? No need to see this page again.
  onAuthReady((user) => {
    if (user) window.location.href = "index.html";
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";

    const { error } = await logInUser(email, password);

    submitBtn.disabled = false;
    submitBtn.textContent = "LOGIN";

    if (error) {
      showMessage(error.message, "error");
      return;
    }
    window.location.href = "index.html";
  });

  document.getElementById("forgotBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) {
      showMessage("Enter your email above first, then click Forgot password.", "error");
      return;
    }
    const { error } = await sendPasswordReset(email);
    if (error) {
      showMessage(error.message, "error");
    } else {
      showMessage("Check your email for a password reset link.", "success");
    }
  });
</script>
</body>
</html>
